name: CI

# Three jobs, the same gate on a different platform family each:
#  * build         — compile the Android head and run the StyleCop / Meziantou
#                    analyzers. Rules escalated to "error" in .editorconfig fail
#                    the build, so this is a real quality gate rather than a
#                    compile check.
#  * build-windows — the same gate for the Windows head. It needs its own runner
#                    for two reasons: the Windows head only exists when building
#                    on Windows (see the IsOSPlatform condition on
#                    TargetFrameworks), and it is the only head that reports the
#                    WinRT/CsWinRT analyzers — MVVMTK0045 and friends are
#                    invisible to the Ubuntu job.
#  * build-apple   — the same gate for the iOS and MacCatalyst heads, which can
#                    only be built on macOS. This is the job Register does not
#                    have, and not having it is precisely how Register's Apple
#                    heads came to rot unnoticed. Hand has real code that no
#                    other job compiles at all — Apple/**/*.cs is included only
#                    for these two target frameworks — so without this the
#                    Apple-only sources were never once built by CI.
#
# Ported from Register's ci.yml, deliberately: the two apps are maintained by
# the same people, share .editorconfig, stylecop.json and Directory.Build.props
# byte for byte, and a second CI dialect would only mean two sets of habits.
#
# Three things Register's workflow carries that are absent here, so nobody
# "restores parity" by adding them back:
#
#  * No GitHub Packages preflight. Register restores Integrity.Client from a
#    private feed and has to probe the credentials; Hand has no nuget.config and
#    no private dependencies, so restore needs no token at all.
#  * No appsettings.json placeholder step. Register embeds its copy
#    unconditionally and CI has to write a stub. Hand's csproj already guards
#    both git-ignored files with Condition="Exists(...)" — appsettings.json and
#    Platforms/Android/google-services.json — and the heads are verified to
#    build without either. A placeholder here would be covering for a problem
#    this repo does not have.
#  * No test job. There is no test project in this repo yet. When there is, it
#    belongs here alongside these, in the shape of Register's — xUnit v3 on
#    Microsoft.Testing.Platform, coverlet.console for coverage, Coveralls upload.
#
# ---------------------------------------------------------------------------
# Currently: Android on every push and pull request; Windows and Apple by hand.
# ---------------------------------------------------------------------------
#
# All three jobs are kept and all three still work — the other two are gated to
# workflow_dispatch so an ordinary push pays for one runner instead of three.
# Android is the head being proven first (see the README), so it is the one
# worth blocking a merge on.
#
# Run the other two from Actions -> CI -> Run workflow. Do that before anything
# ships, because the point of having them stands: a head nobody builds is a
# head nobody knows is broken, and the Apple heads compile 335 lines that no
# other job touches. Gating them is a speed trade, not a decision that they
# stopped mattering.
#
# To put a head back on every push, delete its `if:` line. Nothing else needs
# changing.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & analyze (net10.0-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hand
        uses: actions/checkout@v5

      # JDK 21: what .NET 10's Android SDK builds against, and what the Android
      # SDK's API 36 tooling expects.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Single build with implicit restore. HandAndroidOnly=true trims the app
      # to just the net10.0-android head, so only the Android graph is restored
      # and built — no iOS/MacCatalyst workloads needed on this runner. Still do
      # NOT pass -f net10.0-android instead: that sets TargetFramework as a
      # global property, which would force the TFM onto any net10.0-only project
      # in the tree and break its restore (NU1105). The flag narrows only this
      # project's TargetFrameworks.
      #
      # Debug config: no code signing (no keystore in the repo) and no release
      # trimming. Analyzer errors from .editorconfig break the build here.
      #
      # UseDevCredentials=false matters more than it looks. It defaults to true
      # in the csproj, which embeds devsettings.json and defines
      # USE_DEV_CREDENTIALS — so a build that left it alone would compile the
      # convenience path and leave the shipping path unanalysed. CI gates what
      # ships. (It also keeps a git-ignored file out of the equation entirely.)
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Debug
          -p:HandAndroidOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

  build-windows:
    name: Build & analyze (net10.0-windows)
    runs-on: windows-latest
    # Manual for now — see the header. Delete this line to restore it to every
    # push and pull request.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout hand
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # No JDK and no Android SDK here — the Windows head needs neither.
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # HandWindowsOnly mirrors HandAndroidOnly: it narrows this project's
      # TargetFrameworks to the single head under test, so the runner needs no
      # Android/iOS/MacCatalyst workloads. As in the Android job, do NOT
      # substitute the -f option — see the comment there. UseDevCredentials is
      # off for the reason the Android job spells out.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Debug
          -p:HandWindowsOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

  build-apple:
    name: Build & analyze (net10.0-ios, net10.0-maccatalyst)
    runs-on: macos-latest
    # Manual for now — see the header. Delete this line to restore it to every
    # push and pull request. Worth running before a release whatever else
    # happens: nothing else in this workflow compiles Apple/**/*.cs.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout hand
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Both Apple workloads, because HandAppleOnly builds both heads in one
      # invocation — see the csproj for why they are not split into a job each.
      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst

      # No code signing and no provisioning profile, and none is needed: this is
      # a Debug build with no RuntimeIdentifier, which targets the simulator and
      # does not sign. The csproj sets no signing properties for these heads at
      # all, so there is nothing here to opt out of — if that ever changes, this
      # job is where it will show up first.
      #
      # HandAppleOnly narrows TargetFrameworks to the two Apple heads so this
      # runner needs no Android or Windows workload. As in the other jobs, do
      # NOT substitute -f: that sets TargetFramework as a global property and
      # breaks restore with NU1105. UseDevCredentials is off for the reason the
      # Android job spells out.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Debug
          -p:HandAppleOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true
