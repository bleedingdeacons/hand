name: CI

# Five jobs: compile each mobile head, run the unit tests, scan, and — only on
# a green main — cut a version.
#
#  * build         — compile the Android head and run the StyleCop / Meziantou
#                    analyzers. Rules escalated to "error" in .editorconfig fail
#                    the build, so this is a real quality gate rather than a
#                    compile check. Then builds a Release APK and uploads it.
#  * ios           — the same for the iOS head, on macOS because nothing else
#                    can build one, and archives an unsigned .ipa.
#  * test          — run the xUnit v3 suite over Hand.Core (the MAUI-free half
#                    of the app) with Coverlet coverage, and upload the report
#                    to Coveralls. Ubuntu, no workload: Hand.Core and its tests
#                    are plain net10.0, which is the entire reason that split
#                    exists — see Hand.Core's project file.
#  * semgrep       — a job of its own rather than a step, because the other jobs
#                    install a JDK and the MAUI workload and Semgrep needs
#                    neither.
#  * version       — bumps the version, tags it and publishes a GitHub Release
#                    with an APK rebuilt at that version; only after all four
#                    have passed.
#
# <b>Both mobile heads are built, and both produce something
# installable-shaped.</b> This file used to say the iOS head could not be built
# by CI at all, because the entitlements the notification service extension
# needs force signing-identity detection and no runner has a certificate. That
# reasoning was wrong: _DetectSigningIdentity is conditioned on EnableCodeSigning,
# not on the entitlements. -p:HandUnsigned=true switches signing off and the
# detection never runs. Nothing had to become conditional; the entitlements are
# still declared unconditionally, which is where they belong.
#
# What the iOS job therefore does NOT prove: that the entitlements are right.
# It compiles the head and the extension. The shared keychain group and the App
# Group are only exercised by a Mac with a real identity.
#
# <b>Neither artifact is a shipping artifact, and both are easy to mistake for
# one.</b>
#
#  * The .ipa is unsigned. An installable one needs an Apple Developer Program
#    membership, a distribution certificate and a provisioning profile, none of
#    which exist. It is a compile gate and a re-signable input, and it installs
#    on nothing as it stands.
#  * The APK is signed with the runner's throwaway debug keystore, which is not
#    the one on any developer machine. It will refuse to install over a locally
#    built Hand with INSTALL_FAILED_UPDATE_INCOMPATIBLE, and getting past that
#    means uninstalling — which drops this handset's enrolment and its local
#    alert history. Nothing is permanently lost the way it is in Link (Reach
#    holds the payload key, so a re-enrolled handset can read new alerts
#    again), but the handset is off the rota until somebody signs it back in.
#    Do not do it to a duty phone mid-shift.
#
# <b>Push depends on a secret, and its absence is silent.</b> Both Android
# builds write Platforms/Android/google-services.json from the
# GOOGLE_SERVICES_JSON secret. Without it the build still succeeds and the
# artifact enrols POLL-ONLY — alerts arrive on the poll interval while the app
# is running, and a handset with the app closed does not ring. v1.17.1 shipped
# that way and nothing said so: it was found by unzipping the released APK and
# finding no AIza… key in its resources.arsc where a local build had one. The
# script now says which state it is in, in the log, every run.
#
# WHAT STILL COMPILES NOWHERE. Two heads have no job, by decision rather than
# by accident:
#
#  * Platforms/Windows/** is built by nothing, so the WinRT/CsWinRT analyzers —
#    MVVMTK0045 and friends — are reported only by a Windows runner and are
#    therefore reported nowhere.
#  * Platforms/MacCatalyst/** likewise. Apple/**/*.cs is no longer in this list:
#    it compiles into the ios head, so the ios job below covers it. That was the
#    sharpest of these costs — it is how Register's Apple heads came to rot —
#    and it is the one this change buys back.
#
# Restoring either job is a matter of putting it back and running it on macOS
# or Windows respectively; nothing else in the repo depends on their absence.
#
# Ported from Register's ci.yml, deliberately: the two apps are maintained by
# the same people, share .editorconfig, stylecop.json and Directory.Build.props
# byte for byte, and a second CI dialect would only mean two sets of habits.
#
# Two things Register's workflow carries that are absent from every job here,
# so nobody "restores parity" by adding them back:
#
#  * No GitHub Packages preflight. Register restores Integrity.Client from a
#    private feed and has to probe the credentials; Hand has no nuget.config and
#    no private dependencies, so restore needs no token at all.
#  * No appsettings.json placeholder step. Register embeds its copy
#    unconditionally and CI has to write a stub. Hand's csproj already guards
#    both git-ignored files with Condition="Exists(...)" — appsettings.json and
#    Platforms/Android/google-services.json — and the heads are verified to
#    build without either. A placeholder here would be covering for a problem
#    this repo does not have.
#
# ---------------------------------------------------------------------------
# Currently: Android and iOS on every push and pull request. Nothing by hand.
# ---------------------------------------------------------------------------
#
# The Windows and MacCatalyst jobs this file once described were deleted, not
# gated behind workflow_dispatch — the paragraph claiming they were still here
# to be run manually outlived them by some weeks, which is the sort of thing a
# comment does when nobody has to run it. Both heads still build locally.
#
# The ios job is not gated either, and that is a real cost worth naming: it is
# a macOS runner, the slow and contended kind, on every push. It is free on a
# public repository and would be the expensive part of this workflow on a
# private one. Gating it would put Apple/**/*.cs back to being compiled by
# nothing, which is the state this change exists to leave.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pull request runs share one group per ref, so pushing again cancels the
# superseded run and saves runner minutes. Runs on main get a group of their
# own (run_id is unique) and so cancel nothing: the version job below lives
# in this workflow now, and a cancelled run would drop a version bump
# entirely. Same shape the PHP plugin suite uses.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & analyze (net10.0-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hand
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21: what .NET 10's Android SDK builds against, and what the Android
      # SDK's API 36 tooling expects.
      - name: Setup JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.HAND_BASE_URL }}
        run: bash .github/scripts/write-appsettings.sh

      # Android only — the iOS job needs no equivalent, because iOS push is
      # APNs through the notification service extension and has nothing to do
      # with this file.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/write-google-services.sh

      # Single build with implicit restore. HandAndroidOnly=true trims the app
      # to just the net10.0-android head, so only the Android graph is restored
      # and built — no iOS/MacCatalyst workloads needed on this runner. Still do
      # NOT pass -f net10.0-android instead: that sets TargetFramework as a
      # global property, which would force the TFM onto any net10.0-only project
      # in the tree and break its restore (NU1105). The flag narrows only this
      # project's TargetFrameworks.
      #
      # Debug config: no code signing (no keystore in the repo) and no release
      # trimming. Analyzer errors from .editorconfig break the build here.
      #
      # UseDevCredentials=false matters more than it looks. It defaults to true
      # in the csproj, which embeds devsettings.json and defines
      # USE_DEV_CREDENTIALS — so a build that left it alone would compile the
      # convenience path and leave the shipping path unanalysed. CI gates what
      # ships. (It also keeps a git-ignored file out of the equation entirely.)
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Debug
          -p:HandAndroidOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

      # A separate Release build rather than uploading the Debug output above.
      #
      # Debug means Fast Deployment, which on this project is not merely
      # unhelpful but actively broken — the managed assemblies are left out of
      # the APK, and the 15MB result installs, launches and dies before any of
      # our code runs. The csproj carries the whole account beside
      # TargetFrameworks. Release embeds them by default and strips to one ABI,
      # so it is both correct and a third the size.
      #
      # UseDevCredentials=false for the same reason the analyze step passes it,
      # and it matters more here: this artifact is a thing somebody installs,
      # and devsettings.json has no business being inside one.
      - name: Build the APK
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Release
          -p:HandAndroidOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

      # -Signed.apk is the one to keep: .NET Android emits an unsigned
      # intermediate alongside it, and uploading both would leave whoever
      # downloads them to guess. "Signed" here means the runner's own debug
      # keystore — see the header.
      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hand-apk
          path: TheBleedingDeacons.Intergroup.Hand/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build & archive (net10.0-ios)

    # macOS is not a preference: the iOS toolchain will not run anywhere else.
    # Public repository, so GitHub-hosted macOS minutes are free.
    #
    # macos-26, not macos-15. The .NET for iOS SDK pins the Xcode it will build
    # against and refuses anything older — the macos-15 image tops out at 16.4,
    # which fails at the first target with a clear message and no build.
    # macos-26 ships Xcode 26.6 as its default. Link's ios job learned this
    # first; this is the same runner for the same reason.
    runs-on: macos-26

    steps:
      - name: Checkout hand
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Pinned rather than left to the image default, which is 26.6 today and is
      # not promised to stay there. The .NET for iOS SDK refuses an Xcode older
      # than it expects, so the day the image moves this job either keeps
      # working or says exactly which version it wanted — `xcodebuild -version`
      # in the log is what makes that readable.
      #
      # Falls back to the newest installed Xcode rather than failing, so an
      # image that has moved on gets one honest attempt before the .NET SDK
      # gives its own verdict.
      - name: Select Xcode
        run: |
          set -euo pipefail
          wanted=/Applications/Xcode_26.6.app
          if [ ! -d "$wanted" ]; then
            echo "Xcode 26.6 is not on this image; falling back to the newest installed."
            ls -d /Applications/Xcode*.app || true
            wanted=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Selecting $wanted"
          sudo xcode-select -s "$wanted"
          xcodebuild -version

      # maui-ios, not maui: the full workload would pull in the Android SDK and
      # MacCatalyst for a job that builds neither.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Write appsettings.json
        env:
          BASE_URL: ${{ vars.HAND_BASE_URL }}
        run: bash .github/scripts/write-appsettings.sh

      # Release for a device (ios-arm64), unsigned.
      #
      # HandIosOnly narrows TargetFrameworks to the iOS head. Do NOT reach for
      # -f net10.0-ios instead: that sets TargetFramework as a global property
      # and forces it onto Hand.Core, which is plain net10.0, and its restore
      # fails with NU1105. The csproj says the same at more length.
      #
      # HandUnsigned switches off code signing, which is the whole of what
      # unblocks this job: _DetectSigningIdentity is gated on EnableCodeSigning,
      # so with it false the "No valid iOS code signing keys found in keychain"
      # stop never happens. The entitlements stay declared. It is a global
      # property here on purpose — the notification service extension is a
      # separate project bundled into the .app and has to be unsigned too.
      #
      # The device RID rather than a simulator one is deliberate — a simulator
      # build needs no signing at all and would be an easier green, but it
      # produces a .app for an architecture no phone runs, and calling that an
      # iOS artifact would be a lie the badge could not tell apart.
      - name: Build the iOS head, unsigned
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Release
          -p:HandIosOnly=true
          -p:HandUnsigned=true
          -p:UseDevCredentials=false
          -p:RuntimeIdentifier=ios-arm64
          -p:ContinuousIntegrationBuild=true

      # An .ipa is a zip with the .app inside a Payload/ directory, and that is
      # the whole format. Assembled by hand rather than with ArchiveOnBuild,
      # which drives Xcode's archive step and wants a signing identity — the one
      # thing this job does not have.
      #
      # -y keeps symlinks as symlinks. A framework bundle is full of them, and
      # following them produces an archive that is larger and, on iOS, wrong.
      - name: Assemble the .ipa
        run: |
          set -euo pipefail
          app=$(find TheBleedingDeacons.Intergroup.Hand/bin/Release/net10.0-ios \
            -maxdepth 3 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo 'No .app was produced; nothing to archive.' >&2
            exit 1
          fi
          echo "Archiving $app"
          # The extension should be inside it. Not fatal if it is missing — the
          # build would have failed on the reference — but worth saying in the
          # log, because a silently absent PlugIns/ is how an .app that looks
          # fine turns out to have no notification service in it.
          ls "$app/PlugIns" || echo 'No PlugIns/ in the .app — the extension was not bundled.'
          mkdir -p archive/Payload
          cp -R "$app" archive/Payload/
          (cd archive && zip -qry ../hand-unsigned.ipa Payload)
          ls -la hand-unsigned.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hand-ipa-unsigned
          path: hand-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hand
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # No MAUI workload and no JDK: Hand.Core and its test project are plain
      # net10.0. Building the test project pulls Hand.Core in with it.
      - name: Build tests
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand.Tests/TheBleedingDeacons.Intergroup.Hand.Tests.csproj
          -c Debug

      # xUnit v3 runs on Microsoft.Testing.Platform, so the test project is an
      # executable. coverlet.console instruments Hand.Core and runs that test
      # host, producing a Cobertura report. (coverlet's collector / msbuild
      # integrations hook VSTest, which MTP does not use — hence the tool.)
      #
      # --include narrows the report to Hand.Core: the test assembly and the
      # NuGet dependencies are not what this number is about. The app project
      # is not in it either, because nothing can reference it — that is what
      # the split is for, and what the README says the badge covers.
      #
      # --exclude-by-attribute Obsolete leaves deprecated code out of the
      # figure. Writing tests for something already marked for removal would
      # move the number without improving anything, and leaving it in would
      # penalise the deprecation instead of the debt.
      - name: Test with coverage
        run: >
          dotnet coverlet TheBleedingDeacons.Intergroup.Hand.Tests/bin/Debug/net10.0/TheBleedingDeacons.Intergroup.Hand.Tests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Intergroup.Hand.Tests/bin/Debug/net10.0/TheBleedingDeacons.Intergroup.Hand.Tests.dll"
          --format cobertura
          --output coverage/coverage.cobertura.xml
          --include "[TheBleedingDeacons.Intergroup.Hand.Core]*"
          --exclude-by-attribute Obsolete

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          # Public repo: the built-in GITHUB_TOKEN authenticates the upload,
          # so no separate Coveralls token/secret is required.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura
          fail-on-error: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # A job of its own, rather than a step inside the build as the PHP plugins
    # do it. There the scan is a step because it has to fail before
    # `composer install`; here the surrounding jobs install a JDK, the .NET SDK
    # and (in hand) the MAUI Android workload, none of which Semgrep needs. A
    # separate job runs in parallel and reports on its own terms.
    #
    # `semgrep ci` is diff-aware on a pull request, so it fails only on what
    # that PR introduces. Which findings are fatal is decided by the Block
    # remediation policy in Semgrep - currently Critical or High severity Code
    # findings - not by anything in this file.
    #
    # The version job below has this job in its `needs:`, so a red Semgrep on
    # main stops a version being cut, the same way `release: needs: ci` works
    # in the PHP plugin suite.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci

  version:
    name: Bump version & publish the release
    # The whole point of this change: the bump now waits on every gate. Before,
    # this lived in its own workflow triggered by `push` with no `needs:` at
    # all, so a version was cut whether or not the build, the tests or Semgrep
    # had passed. `needs:` makes a version something only green code gets.
    #
    # `ios` is in here on purpose, and it is the one entry worth arguing about:
    # a broken iOS head now stops an Android release. That is the right way
    # round while the two heads share every line of code above the platform
    # folders — a compile error in Hand.Core would break both, and releasing
    # Android from a tree that does not build is how the iOS head would quietly
    # rot back to the state this change took it out of. Drop it from this list
    # the day the iOS head has its own version.
    needs: [build, ios, test, semgrep]

    # main only, and never for pull_request runs of this same workflow.
    #
    # <b>workflow_dispatch releases too, and that is deliberate.</b> A merge is
    # the release here, so when a merge's own run does not survive there is
    # otherwise no second way to cut one — and a merge cannot be repeated. The
    # PHP plugin suite learned this the hard way in the Actions outage of
    # 2026-08-06: a run wedged at `queued` with no runner, refusing cancel
    # ("already completed"), rerun ("already running") and force-cancel (409),
    # and the release had to wait a day for an unrelated second PR to carry it.
    #
    # Safe to run twice. bump-version.sh refuses to bump when HEAD is already a
    # `chore: version` commit, so dispatching straight after a successful
    # release is a no-op rather than a second bump; and both the tag and the
    # GitHub Release steps below check for the thing already existing. What a
    # dispatch is for is the case where the push's run never produced one.
    #
    # It reads the range differently, which is already handled: github.event.before
    # does not exist on a dispatch, and the bump step falls back to HEAD~1.
    if: >
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    # The workflow default is contents: read; pushing the version commit needs
    # write, asked for here so nothing else in this file gets it.
    permissions:
      contents: write

    # Serialise. Two merges landing close together must not race to compute the
    # same next version. Deliberately not cancel-in-progress: a cancelled run
    # would drop a bump entirely.
    concurrency:
      group: version-main
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the bump is derived by walking the commits this push
          # brought in.
          fetch-depth: 0

      - name: Compute and apply the bump
        id: bump
        # Invoked through bash rather than directly: this repo is authored on
        # Windows, where git frequently does not record the executable bit, and
        # a missing +x would fail the run for a reason nothing in the diff shows.
        #
        # github.event.before is the tip main had before this push. It is
        # all-zeros on a branch's first push, and can point at a commit this
        # clone does not have after a force-push, so fall back to HEAD~1.
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No usable github.event.before; falling back to HEAD~1."
            before="HEAD~1"
          fi
          bash .github/scripts/bump-version.sh "${before}..HEAD"

      - name: Commit the new version
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] so this push does not re-run the build jobs against a
          # commit whose only change is a version string. The script also
          # refuses to bump when HEAD is already a version commit, so the loop
          # is closed twice over — belt and braces, because a runaway here
          # would bump on every iteration.
          git commit -am "chore: version ${{ steps.bump.outputs.version }} [skip ci]"

          # Rebase onto anything that landed while this job was running, and
          # retry. A bare `git push` here fails outright when main has moved
          # between the checkout above and this line, and that is not
          # hypothetical — it cost Link a whole release on 2026-09-05, when a
          # merge landed sixteen seconds before this push. Every gate had
          # passed; the version was simply lost, and the next release skipped
          # a number to catch up. Hand's job is Link's, ported, so it had the
          # identical exposure and had simply not been unlucky yet.
          #
          # The concurrency group above serialises this job against *itself*,
          # so the race is never two version jobs. It is a person merging
          # while one is in flight, which no amount of job-level concurrency
          # can prevent — the other writer is not a job.
          #
          # Rebasing is safe for the version this job computed. The bump is
          # derived from the commit range this run was triggered for, and the
          # commits that arrived meanwhile are not in that range: they get
          # their own run and their own bump. Landing this commit on top of
          # them skips nothing and double-counts nothing.
          #
          # A conflict is deliberately not retried. The only way to conflict
          # is another writer touching the same version line, which the
          # concurrency group already rules out for this job — so it means
          # something genuinely unexpected, and failing loudly beats
          # resolving it blind.
          #
          # Note the plugin repos solve this a shorter way, with an
          # unconditional `git pull --rebase` before the push. That closes the
          # long window (the minutes spent building) but leaves a short one
          # between the pull and the push. This form has no such gap, which is
          # why it is the one used here and in Link rather than the other.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed the version commit on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; main moved. Rebasing onto it."
            if ! git pull --rebase origin main; then
              echo "Rebase onto main failed; leaving it alone." >&2
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Could not push the version commit after 3 attempts." >&2
          exit 1

      # The tag is what a release hangs off, and this repo had none:
      # bump-version.sh reads the current version out of the csproj rather than
      # from `git describe`, so nothing here has ever needed one. That is a
      # difference from Link worth knowing before assuming the two scripts are
      # interchangeable — Link's tags are load-bearing and these are not.
      #
      # Written after the commit so it points at the version it names, and
      # guarded against existing so a re-run of a green release is a no-op
      # rather than a failure.
      - name: Tag the release
        if: steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          tag="v${{ steps.bump.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      # ---------------------------------------------------------------
      # Publish a GitHub Release, with an APK built at the version it names.
      #
      # Until now this job bumped and stopped. The build job's artifact expires
      # after 30 days, so a version older than a month had nothing to show for
      # itself at all.
      #
      # THE REBUILD IS THE POINT, and it is why this is not a download-artifact
      # from the build job. That artifact was built from the commit *before* the
      # bump, so its manifest carries the previous version and its Android
      # versionCode is one behind; attaching it to a tag naming the new one
      # would ship an APK that disagrees with its own release. Worse here than
      # in Link, because versionCode is what decides whether a build can update
      # an existing install.
      #
      # Android only. The .ipa is built on macOS and this job is ubuntu, and
      # plumbing it across would buy nothing: it is unsigned, so it installs on
      # precisely nothing until somebody with an Apple Developer Program
      # certificate re-signs it.
      - name: Setup JDK 21
        if: steps.bump.outputs.version != ''
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        if: steps.bump.outputs.version != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        if: steps.bump.outputs.version != ''
        run: dotnet workload install maui-android

      # Same script and same rules as the build job — see the long comment in
      # it. A release APK with no Reach address would be the least useful of
      # all the artifacts here, since it is the one somebody keeps.
      - name: Write appsettings.json
        if: steps.bump.outputs.version != ''
        env:
          BASE_URL: ${{ vars.HAND_BASE_URL }}
        run: bash .github/scripts/write-appsettings.sh

      # This one matters more here than in the build job. The build job's
      # artifact is something a developer downloads; this is the release APK,
      # the one that ends up on a duty handset — and without Firebase it enrols
      # poll-only and will not ring when the app is closed. v1.17.1 shipped
      # exactly that way, which is what prompted this step.
      - name: Write google-services.json
        if: steps.bump.outputs.version != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/write-google-services.sh

      # Builds the working tree, which by this point carries the bumped csproj
      # written by the commit step above.
      - name: Build the release APK
        if: steps.bump.outputs.version != ''
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Hand/TheBleedingDeacons.Intergroup.Hand.csproj
          -c Release
          -p:HandAndroidOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

      # -Signed.apk is the one to keep: .NET Android emits an unsigned
      # intermediate alongside it. Renamed for the version so a downloaded file
      # still says what it is once it is sitting in somebody's downloads folder
      # next to four others all called
      # com.thebleedingdeacons.intergroup.hand-Signed.apk.
      - name: Name the APK for its version
        id: apk
        if: steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          src=$(ls TheBleedingDeacons.Intergroup.Hand/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo 'No -Signed.apk was produced. bin/Release/net10.0-android holds:' >&2
            ls -l TheBleedingDeacons.Intergroup.Hand/bin/Release/net10.0-android || true
            exit 1
          fi
          out="hand-${{ steps.bump.outputs.version }}.apk"
          cp "$src" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # The body is not decoration. This APK is signed with the runner's
      # throwaway debug keystore, and somebody will eventually find this page
      # without having read a line of ci.yml — at which point what uninstalling
      # costs needs to be on the page they are looking at.
      - name: Write the release notes
        if: steps.bump.outputs.version != ''
        run: |
          cat > release-notes.md <<'EOF'
          ### What this APK is

          A **Debug-keystore-signed** Android build, produced on a GitHub runner
          from the commit this tag names. It is a compile gate and a
          convenience — not a shipping artifact.

          ### Before you install it

          It is signed with the runner's own throwaway key, which is not the key
          on any developer machine. If you already have a locally built Hand on
          the handset, it will refuse to install over it with
          `INSTALL_FAILED_UPDATE_INCOMPATIBLE`.

          Getting past that means uninstalling, which drops **this handset's
          enrolment and its local alert history**. Nothing becomes permanently
          unreadable — Reach holds the payload key, so a handset that signs in
          again gets a fresh one and reads new alerts normally — but the handset
          is off the rota until somebody does sign it back in. Not something to
          do to a duty phone mid-shift.

          ### iOS

          Not attached. The `.ipa` this workflow archives is unsigned and
          installs on nothing until it is re-signed with an Apple Developer
          Program certificate. It is on the CI run, not here.
          EOF

      # Guarded against existing so a re-run of a green release is a no-op
      # rather than a failure, matching the tag step above.
      - name: Publish the GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.bump.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          gh release create "$tag" \
            "${{ steps.apk.outputs.apk }}" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            echo "### Version ${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.bump }} bump)" >> "$GITHUB_STEP_SUMMARY"
            echo "Android versionCode ${{ steps.bump.outputs.code }}." >> "$GITHUB_STEP_SUMMARY"
            echo "Released as [v${{ steps.bump.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.bump.outputs.version }}) with \`${{ steps.apk.outputs.apk }}\` attached." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Version unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to version in this push." >> "$GITHUB_STEP_SUMMARY"
          fi
